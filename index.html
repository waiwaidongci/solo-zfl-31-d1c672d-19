<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台 · 离线版权水印与溯源核验</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>手工织锦纹样排版台</h1>
      <div class="sub">绘制经纬网格纹样、统计色线用量；离线嵌入版权水印并做溯源核验。</div>
    </div>
    <div class="toolbar">
      <button id="saveBtn">保存方案</button>
      <button id="exportBtn" class="secondary">导出JSON</button>
      <button id="exportPngBtn" class="secondary">导出PNG</button>
      <button id="exportRegBtn" class="secondary">导出登记册</button>
    </div>
  </header>

  <main class="app">
    <!-- 左：绘制 -->
    <aside class="panel">
      <h2>画布</h2>
      <div class="form-row">
        <div><label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36"></div>
        <div><label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32"></div>
      </div>
      <button id="newBtn" class="secondary wide">新建网格</button>

      <h2>色线库</h2>
      <div class="palette" id="palette"></div>

      <h2>基础纹样块</h2>
      <div class="blocks">
        <button type="button" data-block="dot" class="secondary active">单点</button>
        <button type="button" data-block="cross" class="secondary">十字</button>
        <button type="button" data-block="diamond" class="secondary">小菱形</button>
      </div>
      <p class="hint">点击格点填色，按住拖动可连续填色。水印只在 2×2 块内重排明暗，<b>不改变每种色线的数量</b>。</p>

      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>

    <!-- 中：画布 + 核验 -->
    <section class="panel center-panel">
      <div id="wmBadge" class="wm-badge ready"></div>
      <div class="gridwrap"><div class="grid" id="grid"></div></div>
      <div class="editbar">
        <button id="undoBtn" class="secondary">撤销</button>
        <button id="redoBtn" class="secondary">重做</button>
        <button id="verifyBtn" class="verify">核验当前画布</button>
      </div>

      <h2>溯源核验</h2>
      <div id="verifyPanel">
        <div class="verify-inputs">
          <div class="filebox">
            <label>核验图样图片（PNG/照片：裁切、缩放、旋转、翻转、量化后均可）</label>
            <input id="imageFile" type="file" accept="image/*">
            <div class="form-row">
              <div><label>格数列（可选，图像识别不准时手填）</label><input id="hintCols" type="number" min="6" max="36" placeholder="自动"></div>
              <div><label>格数行（可选）</label><input id="hintRows" type="number" min="6" max="32" placeholder="自动"></div>
            </div>
          </div>
          <div class="filebox">
            <label>批量核验：多个方案 JSON</label>
            <input id="batchFiles" type="file" accept=".json,application/json" multiple>
            <button id="batchBtn" class="secondary wide">连续核验所选方案</button>
          </div>
        </div>
        <div id="verifyResult" style="display:none"></div>
        <div id="batchResult"></div>
      </div>
    </section>

    <!-- 右：登记 -->
    <aside class="panel">
      <h2>版权登记 / 嵌入水印</h2>
      <label>方案名称</label><input id="regName" placeholder="如：山纹云雷锦">
      <label>作者编号（1–32767）</label><input id="regAuthor" type="number" min="1" max="32767" value="2026">
      <label>授权范围</label>
      <select id="regScope">
        <option value="1">个人留存</option>
        <option value="2">非营利展示</option>
        <option value="3">教学使用</option>
        <option value="4">内部织造</option>
        <option value="5" selected>商用授权</option>
        <option value="6">独占授权</option>
      </select>
      <div class="form-row">
        <div><label>授权起始月</label><input id="regStart" type="month"></div>
        <div><label>月数（0=长期）</label><input id="regMonths" type="number" min="0" max="63" value="12"></div>
      </div>
      <label>备注</label><input id="regNote" maxlength="200">
      <button id="registerBtn" class="wide">计算指纹并嵌入水印</button>
      <p class="hint">登记同时保存“原图指纹 + 水印图指纹”。核验不通过时，<b>结果不会覆盖登记原方案</b>。</p>

      <h2>导入</h2>
      <label class="filelabel">导入方案或登记册 JSON
        <input id="importFile" type="file" accept=".json,application/json">
      </label>

      <h2>本机登记册（<span id="regCount"></span>）</h2>
      <div id="regList" class="reglist"></div>
    </aside>
  </main>

  <div id="toast"></div>
  <script src="js/watermark.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/raster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
